name: myCICD-Using-Github-Action
on: 
  push:   #Automatic Trigger  Develoer-----> GitHub---->GitHubAction

jobs:
  myjob1:
    runs-on: ubuntu-latest   # 26.04
    steps:
      - name: mystep1
        run: |
          sudo usermod -aG  sudo,docker runner
          sudo apt update -y
          sudo apt upgrade -y
          sudo apt install docker.io docker-compose -y
          sudo docker --version
          sudo docker-compose version
          sudo systemctl status docker
      - name: mystep2
        run: |
          ls -al
      - name: mystep3-checkout-source-in-current-workdir
        uses: actions/checkout@v4
      - name: mystep4
        run: |
          ls -al
      - name: mystep5
        run: |
          cat /etc/passwd
      - name: mystep6
        run: |    
          cat /etc/os-release 


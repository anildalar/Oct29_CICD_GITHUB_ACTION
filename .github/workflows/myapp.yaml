name: myCICD-Using-Github-Action
on: 
  push:   #Automatic Trigger  Develoer-----> GitHub---->GitHubAction

jobs:
  myjob1:
    runs-on: ubuntu-latest   # 26.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check Docker
        run: |
          docker --version
          docker compose version
      - name: mystep2
        run: |
          ls -al
      - name: mystep3-checkout-source-in-current-workdir
        uses: actions/checkout@v4
      - name: mystep4
        run: |
          ls -al
      - name: checkimage-and-container
        run: |
          docker image ls
          docker ps -a
      - name: build-image
        run: |    
          docker compose -f docker-compose.devopsstudy.yaml build 
      - name: Verify Docker image
        run: |
          docker image ls
          docker compose -f docker-compose.devopsstudy.yaml config
      - name: build-image-check
        run: |    
          docker compose -f docker-compose.devopsstudy.yaml ps -a
          docker image ls
          docker ps -a
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image to Docker Hub
        run: |
          docker compose -f docker-compose.devopsstudy.yaml push devopsstudy

      - name: Verify pushed image tag
        run: |
          echo "Image: oklabs/myimage:t${BUILD_NUMBER}"
      # - name: Login to remote server
      #   run: |
      #     sshpass -p 'Oklabs@331122' ssh \
      #     -o StrictHostKeyChecking=accept-new \
      #     root@164.68.105.85 \
      #     'ls -al'
      - name: Pull image on production server
        uses: appleboy/ssh-action@v1
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: BUILD_NUMBER
          script: |
            whoami
            hostname
            ls -al
            docker pull oklabs/myimage:t${BUILD_NUMBER}
            docker images

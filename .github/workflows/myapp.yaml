name: myCICD-Using-Github-Action
on: 
  push:   #Automatic Trigger  Develoer-----> GitHub---->GitHubAction

jobs:
  myjob1:
    runs-on: ubuntu-latest   # 26.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check Docker
        run: |
          docker --version
          docker compose version
      - name: mystep2
        run: |
          ls -al
      - name: mystep3-checkout-source-in-current-workdir
        uses: actions/checkout@v4
      - name: mystep4
        run: |
          ls -al
      - name: checkimage-and-container
        run: |
          docker image ls
          docker ps -a
      - name: build-image
        run: |    
          docker compose -f docker-compose.devopsstudy.yaml build devopsstudy
      - name: build-image-check
        run: |    
          docker compose -f docker-compose.devopsstudy.yaml ps -a
          docker image ls
          docker ps -a